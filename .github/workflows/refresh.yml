name: Government Resource Refresh

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-snapshot-writer
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.REFRESH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # Publish the real daily metadata report, not empty keep-alive commits.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install updater dependencies
        run: npm ci --ignore-scripts
      - name: Test updater
        id: tests
        run: npm test
      - name: Refresh changed datasets
        id: sync
        if: steps.tests.outcome == 'success'
        env:
          PRIVATE_SNAPSHOT_R2_ACCOUNT_ID: ${{ secrets.PRIVATE_SNAPSHOT_R2_ACCOUNT_ID }}
          PRIVATE_SNAPSHOT_R2_BUCKET: ${{ vars.PRIVATE_SNAPSHOT_R2_BUCKET }}
          PRIVATE_SNAPSHOT_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.PRIVATE_SNAPSHOT_R2_WRITE_ACCESS_KEY_ID }}
          PRIVATE_SNAPSHOT_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_SNAPSHOT_R2_WRITE_SECRET_ACCESS_KEY }}
        run: npm run gov:resources:sync
      - name: Report current snapshots
        if: always()
        env:
          PRIVATE_SNAPSHOT_R2_ACCOUNT_ID: ${{ secrets.PRIVATE_SNAPSHOT_R2_ACCOUNT_ID }}
          PRIVATE_SNAPSHOT_R2_BUCKET: ${{ vars.PRIVATE_SNAPSHOT_R2_BUCKET }}
          PRIVATE_SNAPSHOT_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.PRIVATE_SNAPSHOT_R2_WRITE_ACCESS_KEY_ID }}
          PRIVATE_SNAPSHOT_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_SNAPSHOT_R2_WRITE_SECRET_ACCESS_KEY }}
          REFRESH_OUTCOME: ${{ steps.sync.outcome }}
          SNAPSHOT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/snapshot-status.js --write-daily
      - name: Publish daily source metadata
        if: always()
        run: |
          if [ ! -f status.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --name-only | grep -v '^status.json$'; then
            echo 'Unexpected modified files; refusing to publish report'
            exit 1
          fi
          git add status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update daily government snapshot status'
          git pull --rebase origin main
          git push origin HEAD:main

name: Government Resource Refresh (Dev and Stage)

on:
  schedule:
    - cron: '43 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gov-snapshot-nonprod-writer
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.NONPROD_REFRESH_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install updater dependencies
        run: npm ci --ignore-scripts
      - name: Test updater
        id: tests
        run: npm test
      - name: Refresh changed datasets
        id: sync
        if: steps.tests.outcome == 'success'
        env:
          PRIVATE_SNAPSHOT_R2_ACCOUNT_ID: ${{ secrets.PRIVATE_SNAPSHOT_R2_ACCOUNT_ID }}
          PRIVATE_SNAPSHOT_R2_BUCKET: autoil-nonprod-vehicle-snapshots
          PRIVATE_SNAPSHOT_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.NONPROD_R2_WRITE_ACCESS_KEY_ID }}
          PRIVATE_SNAPSHOT_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.NONPROD_R2_WRITE_SECRET_ACCESS_KEY }}
        run: npm run gov:resources:sync
      - name: Report current snapshots
        if: always() && steps.tests.outcome == 'success'
        env:
          PRIVATE_SNAPSHOT_R2_ACCOUNT_ID: ${{ secrets.PRIVATE_SNAPSHOT_R2_ACCOUNT_ID }}
          PRIVATE_SNAPSHOT_R2_BUCKET: autoil-nonprod-vehicle-snapshots
          PRIVATE_SNAPSHOT_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.NONPROD_R2_WRITE_ACCESS_KEY_ID }}
          PRIVATE_SNAPSHOT_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.NONPROD_R2_WRITE_SECRET_ACCESS_KEY }}
          REFRESH_OUTCOME: ${{ steps.sync.outcome }}
          SNAPSHOT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/snapshot-status.js

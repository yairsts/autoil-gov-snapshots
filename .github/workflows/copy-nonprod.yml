name: Copy snapshots to Dev and Stage

on:
  schedule:
    - cron: '43 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# Share the writer lock so source shards cannot be retired during a copy.
concurrency:
  group: gov-snapshot-writer
  cancel-in-progress: false

jobs:
  copy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.NONPROD_COPY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test updater
        run: npm test
      - name: Copy and verify all datasets
        env:
          PRIVATE_SNAPSHOT_R2_ACCOUNT_ID: ${{ secrets.PRIVATE_SNAPSHOT_R2_ACCOUNT_ID }}
          SNAPSHOT_SOURCE_READ_ACCESS_KEY_ID: ${{ secrets.SNAPSHOT_SOURCE_READ_ACCESS_KEY_ID }}
          SNAPSHOT_SOURCE_READ_SECRET_ACCESS_KEY: ${{ secrets.SNAPSHOT_SOURCE_READ_SECRET_ACCESS_KEY }}
          NONPROD_R2_WRITE_ACCESS_KEY_ID: ${{ secrets.NONPROD_R2_WRITE_ACCESS_KEY_ID }}
          NONPROD_R2_WRITE_SECRET_ACCESS_KEY: ${{ secrets.NONPROD_R2_WRITE_SECRET_ACCESS_KEY }}
        run: node scripts/copy-nonprod-snapshots.js
